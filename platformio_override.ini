; Badge port — WLED for the Retia 2024 DEF CON badge (ESP32-S3).
; Same as esp32s3dev_8MB_qspi but defaults the LED output to the badge's
; 10x WS2812B NeoPixels on GPIO17.
[env:badge]
extends = env:esp32s3dev_8MB_qspi
build_flags = ${env:esp32s3dev_8MB_qspi.build_flags}
  -D DATA_PINS=17
  -D DEFAULT_LED_COUNT=10
  ;; boot straight into effect 63 = "Pride 2015" rainbow. Both knobs matter:
  ;; DEFAULT_MODE = the segment's constructed mode; DEFAULT_BOOT_FX = the global
  ;; effectCurrent that WLED applies over the segment at boot (led.cpp).
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63

; Dual-output badge build: TWO WS2812 buses —
;   bus 0 = onboard ear NeoPixels (GPIO17, 10 px)
;   bus 1 = offboard J8 strip     (GPIO0,  300 px)
; Standard WLED (own FS + web UI); boots both into the Pride rainbow.
[env:badge-dual]
extends = env:esp32s3dev_8MB_qspi
custom_usermods = ST7789_display   ;; status screen on the badge's ILI9341 TFT
build_flags = ${env:esp32s3dev_8MB_qspi.build_flags}
  -D DATA_PINS=17,0
  -D PIXEL_COUNTS=10,300
  ;; Buttons (index order): A=8, B=7, UP=4, DOWN=5, LEFT=3, RIGHT=6.
  ;;   A     (btn0): tap=on/off,     hold=random color
  ;;   B     (btn1): tap=next effect, hold=brightness, double=next palette
  ;;   UP/DN (btn2/3): tap=+/- brightness, hold=ramp   (custom, button.cpp)
  ;;   L/R   (btn4/5): tap=+/- color hue,  hold=scroll (custom, button.cpp)
  ;; GPIO0 is deliberately NOT a button — it's the J8 strip's data pin.
  -D BTNPIN=8,7,4,5,3,6
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63
  ;; --- badge ILI9341 TFT (shared SPI bus) for the ST7789_display usermod ---
  ;; USER_SETUP_LOADED skips the usermod's ST7789_DRIVER guard; we use ILI9341.
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=11
  -D TFT_MISO=12
  -D TFT_SCLK=13
  -D TFT_CS=47
  -D TFT_DC=40
  -D TFT_RST=41
  -D TOUCH_CS=-1
  -D SPI_FREQUENCY=40000000
  -D USE_FSPI_PORT=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1

; Launcher-guest build: a plain app image for the shared partition table's ota_0
; slot (0xD0000, 2.375MB). FS-less so it never touches Meshtastic's spiffs.
[env:badge-launcher]
extends = env:badge
board_build.partitions = ${PROJECT_DIR}/retia/partitions-shared.csv
board_build.app_partition_name = ota_0
build_flags = ${env:badge.build_flags}
  -D WLED_LAUNCHER_GUEST

; ── WLEDkitty for the Bluetooth Nugget (LOLIN S3 Mini, 4MB) ──────────────────
;   LEDs: GPIO10 (2 onboard ears, chainable). Display: 128x64 I2C OLED on 35/36
;   via the Four-Line-Display usermod (SSD1306_64, flipped 180°). Buttons: same
;   scheme as the badge (A/B + D-pad). Boots into the Pride rainbow.
[env:nugget]
extends = env:esp32s3_4M_qspi
custom_usermods = usermod_v2_four_line_display_ALT
build_flags = ${env:esp32s3_4M_qspi.build_flags}
  -D DATA_PINS=10
  -D DEFAULT_LED_COUNT=2
  -D BTNPIN=44,43,13,18,11,12       ;; A,B,UP,DOWN,LEFT,RIGHT
  -D I2CSDAPIN=35
  -D I2CSCLPIN=36
  -D FLD_TYPE=SSD1306_64            ;; 128x64, SSD1306-compatible (SH1106/CH1116)
  -D FLD_FLIP_DEFAULT               ;; OLED mounted 180°
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63

; ── WLEDkitty as a v2 "Touch" launcher GUEST (SD-installable app image) ──────
;   Plain app image for the v2 shared table's ota_0 (0x90000, 3.25MB). FS-less
;   so it never touches mcfs/spiffs/nesrom/tiles (would wipe MeshCore/Meshtastic).
;   Full experience: dual LED output + TFT status + buttons + Pride.
[env:badge-launcher-v2]
extends = env:badge-dual
board_build.partitions = ${PROJECT_DIR}/retia/partitions-shared-v2.csv
board_build.app_partition_name = ota_0
build_flags = ${env:badge-dual.build_flags}
  -D WLED_LAUNCHER_GUEST

; ── WLEDkitty for the USB Nugget (LOLIN S2 Mini, ESP32-S2, 4MB) ──────────────
;   The USB Nugget is a LOLIN S2 Mini at heart, so it extends that env (I2C on
;   SDA33/SCL35 is already the base default, matching the OLED wiring).
;   LEDs: 1 onboard WS2812 on GPIO12 (chainable). Display: 128x64 SH1106 I2C
;   OLED via the Four-Line-Display usermod. Buttons: 4-way d-pad only (no A/B) —
;   UP=9 DOWN=18 LEFT=11 RIGHT=7. WLED compacts its button vector over disabled
;   (-1) pins, so BTNPIN=-1,9,18,11,7 gives one placeholder (index 0) + the four
;   d-pad buttons at indices 1-4. WLED_NUGGET_S2_DPAD (button.cpp) maps those:
;   tap UP/DOWN = +/- brightness, tap LEFT/RIGHT = +/- hue, hold UP = on/off,
;   hold DOWN = next effect, hold LEFT/RIGHT = scroll hue. Pride boot.
[env:usb-nugget]
extends = env:lolin_s2_mini
custom_usermods = usermod_v2_four_line_display_ALT
build_flags = ${env:lolin_s2_mini.build_flags}
  -D DATA_PINS=12
  -D DEFAULT_LED_COUNT=1
  -D BTNPIN=-1,9,18,11,7             ;; placeholder + UP,DOWN,LEFT,RIGHT -> idx 1-4
  -D WLED_NUGGET_S2_DPAD             ;; 4-button d-pad handlers (button.cpp)
  -D I2CSDAPIN=33
  -D I2CSCLPIN=35
  -D FLD_TYPE=SH1106                 ;; 128x64 SH1106 OLED (RubberNugget SH1106Wire)
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63

; ── WLEDkitty for the Pusheen cat lamp (ESP8266 / nodemcuv2, 4MB) ────────────
;   LEDs: 4x WS2812 on D1 = GPIO5. One button on D3 = GPIO0 (WLED's default
;   button pin): tap = on/off, hold = brightness, double = next palette. No
;   display, no d-pad. Boots into the Pride rainbow.
[env:pusheen]
extends = env:nodemcuv2
custom_usermods =
build_flags = ${env:nodemcuv2.build_flags}
  -D DATA_PINS=5
  ; PIXEL_COUNTS, not DEFAULT_LED_COUNT: const.h unconditionally #defines
  ; DEFAULT_LED_COUNT 30, silently clobbering a -D. PIXEL_COUNTS is #ifndef-guarded.
  -D PIXEL_COUNTS=4
  -D BTNPIN=0
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63

; ── TEMPORARY diagnostic env — not for release ───────────────────────────────
;   Drives three candidate LED pins at once (ESP8266 allows 3 digital buses),
;   4 px each, so a color-coded probe identifies which GPIO is really wired:
;     bus0 px 0-3  = GPIO5  (D1, the documented Pusheen pin)
;     bus1 px 4-7  = GPIO4  (D2)
;     bus2 px 8-11 = GPIO15 (D8, the WiFi Nugget's NeoPixel pin)
;   Delete this env once the pin question is settled.
[env:pusheen-pintest]
extends = env:nodemcuv2
custom_usermods =
build_flags = ${env:nodemcuv2.build_flags}
  -D DATA_PINS=5,4,15
  -D PIXEL_COUNTS=4,4,4
  -D BTNPIN=0
  -D DEFAULT_MODE=0
  -D DEFAULT_BOOT_FX=0

; ── WLEDkitty for the Meshtastic dev badge, proto v1 (ESP32-S3, 8MB) ─────────
;   Board: nugget_hardware/protoboard_boards/proto_meshtastic_badge/v1.
;   Schematic MPN says WROOM-1-N16R8, but the proto is stuffed with an
;   8MB-flash / 2MB-quad-PSRAM module (esptool-verified 2026-07-21, same
;   family as the DEF CON badge) -> use the 8MB qspi base, merge 8MB.
;   MSP2402 2.4" ILI9341 (320x240) on FSPI: MOSI=11 MISO=12 SCLK=13 CS=47
;   DC=4 RST=5. Backlight hardwired to 3V3 (no TFT_BL), touch pins go to the
;   J11 header only (not routed to the MCU) -> TOUCH_CS=-1. No onboard pixels:
;   LED out is J16 (JST-PH 3-pin, 5V, BSS138 level shifter) on GPIO14.
;   Buttons (A,B,UP,DOWN,LEFT,RIGHT) = 7,8,6,3,17,18; BOOT=0 kept out of
;   BTNPIN. Park radio CS=9, SD CS=10, accessory CS=21 (shared SPI bus);
;   DO NOT park the DEF CON defaults here - 48 is the buzzer, 14 the LED data.
;   Audio: SPH0645 I2S mic on BCLK=45 LRCL=46 DOUT=2 (the only bench-safe free
;   pins: 37-42 are driven by the populated RFM95W's DIOs, GPIO1 has the test
;   LED load; 45/46 are straps but only ever ESP-driven clocks here).
[env:dev-badge]
extends = env:esp32s3dev_8MB_qspi
custom_usermods = ST7789_display audioreactive
build_flags = ${env:esp32s3dev_8MB_qspi.build_flags}
  -D SR_DMTYPE=3
  -D UM_AUDIOREACTIVE_ENABLE
  -D I2S_CKPIN=45
  -D I2S_WSPIN=46
  -D I2S_SDPIN=2
  -D DATA_PINS=14
  -D PIXEL_COUNTS=300
  -D BTNPIN=7,8,6,3,17,18
  ;; dev badge boots the audio demo (Freqwave, FFT: pitch=color volume=motion)
  ;; instead of WLEDkitty's usual Pride — deliberate, per operator request.
  -D DEFAULT_MODE=137
  -D DEFAULT_BOOT_FX=137
  -D RETIA_PARK_CS=9,10,21
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=11
  -D TFT_MISO=12
  -D TFT_SCLK=13
  -D TFT_CS=47
  -D TFT_DC=4
  -D TFT_RST=5
  -D TOUCH_CS=-1
  -D SPI_FREQUENCY=40000000
  -D USE_FSPI_PORT=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1

; ── Nibble Zero (ESP32-S3-Zero, 4MB) — port of the Nugget WLEDkitty ──────────
;   Same 128x64 SSD1306 panel as the Nugget, but: I2C on SDA8/SCL7, onboard
;   WS2812 on GPIO21 (1px), 2 buttons A=1/B=2, OLED rotation 0 (no flip).
[env:nibble-zero]
extends = env:esp32s3_4M_qspi
custom_usermods = usermod_v2_four_line_display_ALT
build_flags = ${env:esp32s3_4M_qspi.build_flags}
  -D DATA_PINS=17                   ;; D7 WS2812 (belly + J4 ear-chain) = the VISIBLE pixel; GPIO21 is the hidden module LED
  -D PIXEL_COUNTS=8                 ;; D7 (pixel 0) + up to 7 chained ear pixels on J4 (extras are harmless)
  -D BTNPIN=1,2,40,41,42,45         ;; A,B,UP,DOWN,LEFT,RIGHT (GPIO45=strapping, pullup ok at runtime)
  -D I2CSDAPIN=8
  -D I2CSCLPIN=7
  -D FLD_TYPE=SSD1306_64            ;; 128x64, same panel as the Nugget
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63

; ── Pusheen 130mm cat lamp — esp32_base_puck_v2 (ESP32-S3-WROOM-1 N16R2) ──────
;   NEW ESP32-S3 board (JLCPCB 2026-08). NOT the old ESP8266 cat lamp [env:pusheen].
;   Pinout: RetiaLLC/pusheen_hardware 130mm_Pusheen/esp32_base_puck_v2 KiCad netlist.
;   Silicon-verified: ESP32-S3, 16MB quad flash + 2MB QUAD PSRAM (memory_type
;   qio_qspi), MAC a4:cb:8f:b1:70:ec — the N16R2, NOT the N16R8 opi alt the BOM lists.
;   LED: GPIO16 -> SN74LVC1T45 (3V3->5V) -> 8x WS2812B (D2..D5,D8..D11) -> TP6 ext pad.
;   Buttons: SW3 user = GPIO17 (A, 10K pullup + debounce), SW2 BOOT = GPIO0 (B).
;   SW1 = EN/reset (not a GPIO). No screen -> custom_usermods empty (drops base audioreactive).
[env:pusheen-puck]
extends = env:esp32s3dev_8MB_qspi
custom_usermods =
board_build.partitions = ${esp32.extreme_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = ${env:esp32s3dev_8MB_qspi.build_flags}
  -D DATA_PINS=16                   ;; -> SN74LVC1T45 level shifter -> 8x WS2812B chain
  -D PIXEL_COUNTS=8
  -D BTNPIN=17,0                    ;; A=SW3 user (GPIO17), B=BOOT (GPIO0)
  -D DEFAULT_MODE=63                ;; Pride 2015 (needs BOTH knobs)
  -D DEFAULT_BOOT_FX=63
  -D IRPIN=4                        ;; IR receiver (VS1838B) on GPIO4
  -D IRTYPE=5                       ;; default IR remote = 21-key RGB — EXACT match for the Pusheen remote
  ;; softAP FIX (2026-08-11): the release build brought the AP up before the board settled
  ;; (power-rail + USB-CDC-enumeration race with WiFi/RF init) -> beacons were fine but NO client
  ;; could associate for the entire boot. WLED_DEBUG only ever "worked" because of its hidden
  ;; setup() delay(2500). WLED_BOOTUPDELAY is WLED's official boot-settle knob and fixes it
  ;; cleanly. Bench-verified: 20/20 associations across 3 cold boots WITH it, 0/8 without.
  ;; It is NOT loop/CPU (delay(10) in loop = 0/8), NOT TX power (LOLIN_WIFI_FIX = 0/8),
  ;; NOT the sta-list poll. See the pusheen-puck skill "WLED Wi-Fi" section.
  -D WLED_BOOTUPDELAY=2500
  ;; Unique per-device AP SSID (WLED-<last3 MAC bytes>, e.g. WLED-b170ec) so a fleet of Retia
  ;; WLED devices never collide on "WLED-AP" (a badge once hijacked a by-SSID join). Pass wled1234.
  -D WLED_AP_SSID_UNIQUE

; --- temporary WLED_DEBUG build of pusheen-puck to trace the AP association failure ---
[env:pusheen-puck-dbg]
extends = env:pusheen-puck
build_flags = ${env:pusheen-puck.build_flags}
  -D WLED_DEBUG

; ── Newsheen/Pusheen puck: IR + AUDIO-REACTIVE (I2S mic on the sensor header) ──
;   Extends the fixed pusheen-puck (IR IRTYPE=5 + WLED_BOOTUPDELAY softAP fix) and adds the
;   audioreactive usermod. Mic = SPH0645-class I2S on the puck's I2S header:
;     WS/LRCLK=37, SCK/BCLK=38, SD/DOUT=39.  SR_DMTYPE=3 (SPH0645; runtime-switchable).
;   Boot stays Pride (product identity); audio effects are selectable (IR/app). Mic input only.
[env:pusheen-puck-audio]
extends = env:pusheen-puck
custom_usermods = audioreactive
build_flags = ${env:pusheen-puck.build_flags}
  -D SR_DMTYPE=3
  -D I2S_CKPIN=38
  -D I2S_WSPIN=37
  -D I2S_SDPIN=39
  -D UM_AUDIOREACTIVE_ENABLE
  ;; SPH0645 plugs into the sensor header with its SEL pin on GPIO36 (SCL). Drive it LOW so the
  ;; mic outputs on the LEFT channel WLED reads — no rewiring needed. (See wled.cpp setup().)
  -D WLED_I2S_SEL_GND=36
  ;; Full-featured release boots the audio showcase: Freqwave (137, frequency-reactive) at 100%
  ;; brightness. Overrides the Pride default inherited from pusheen-puck (last -D wins).
  -D DEFAULT_MODE=137
  -D DEFAULT_BOOT_FX=137
  -D WLED_DEFAULT_BRIGHTNESS=255
