; Badge port — WLED for the Retia 2024 DEF CON badge (ESP32-S3).
; Same as esp32s3dev_8MB_qspi but defaults the LED output to the badge's
; 10x WS2812B NeoPixels on GPIO17.
[env:badge]
extends = env:esp32s3dev_8MB_qspi
build_flags = ${env:esp32s3dev_8MB_qspi.build_flags}
  -D DATA_PINS=17
  -D DEFAULT_LED_COUNT=10
  ;; boot straight into effect 63 = "Pride 2015" rainbow. Both knobs matter:
  ;; DEFAULT_MODE = the segment's constructed mode; DEFAULT_BOOT_FX = the global
  ;; effectCurrent that WLED applies over the segment at boot (led.cpp).
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63

; Dual-output badge build: TWO WS2812 buses —
;   bus 0 = onboard ear NeoPixels (GPIO17, 10 px)
;   bus 1 = offboard J8 strip     (GPIO0,  300 px)
; Standard WLED (own FS + web UI); boots both into the Pride rainbow.
[env:badge-dual]
extends = env:esp32s3dev_8MB_qspi
custom_usermods = ST7789_display   ;; status screen on the badge's ILI9341 TFT
build_flags = ${env:esp32s3dev_8MB_qspi.build_flags}
  -D DATA_PINS=17,0
  -D PIXEL_COUNTS=10,300
  ;; Buttons (index order): A=8, B=7, UP=4, DOWN=5, LEFT=3, RIGHT=6.
  ;;   A     (btn0): tap=on/off,     hold=random color
  ;;   B     (btn1): tap=next effect, hold=brightness, double=next palette
  ;;   UP/DN (btn2/3): tap=+/- brightness, hold=ramp   (custom, button.cpp)
  ;;   L/R   (btn4/5): tap=+/- color hue,  hold=scroll (custom, button.cpp)
  ;; GPIO0 is deliberately NOT a button — it's the J8 strip's data pin.
  -D BTNPIN=8,7,4,5,3,6
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63
  ;; --- badge ILI9341 TFT (shared SPI bus) for the ST7789_display usermod ---
  ;; USER_SETUP_LOADED skips the usermod's ST7789_DRIVER guard; we use ILI9341.
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=11
  -D TFT_MISO=12
  -D TFT_SCLK=13
  -D TFT_CS=47
  -D TFT_DC=40
  -D TFT_RST=41
  -D TOUCH_CS=-1
  -D SPI_FREQUENCY=40000000
  -D USE_FSPI_PORT=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1

; Launcher-guest build: a plain app image for the shared partition table's ota_0
; slot (0xD0000, 2.375MB). FS-less so it never touches Meshtastic's spiffs.
[env:badge-launcher]
extends = env:badge
board_build.partitions = ${PROJECT_DIR}/retia/partitions-shared.csv
board_build.app_partition_name = ota_0
build_flags = ${env:badge.build_flags}
  -D WLED_LAUNCHER_GUEST

; ── WLEDkitty for the Bluetooth Nugget (LOLIN S3 Mini, 4MB) ──────────────────
;   LEDs: GPIO10 (2 onboard ears, chainable). Display: 128x64 I2C OLED on 35/36
;   via the Four-Line-Display usermod (SSD1306_64, flipped 180°). Buttons: same
;   scheme as the badge (A/B + D-pad). Boots into the Pride rainbow.
[env:nugget]
extends = env:esp32s3_4M_qspi
custom_usermods = usermod_v2_four_line_display_ALT
build_flags = ${env:esp32s3_4M_qspi.build_flags}
  -D DATA_PINS=10
  -D DEFAULT_LED_COUNT=2
  -D BTNPIN=44,43,13,18,11,12       ;; A,B,UP,DOWN,LEFT,RIGHT
  -D I2CSDAPIN=35
  -D I2CSCLPIN=36
  -D FLD_TYPE=SSD1306_64            ;; 128x64, SSD1306-compatible (SH1106/CH1116)
  -D FLD_FLIP_DEFAULT               ;; OLED mounted 180°
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63

; ── WLEDkitty as a v2 "Touch" launcher GUEST (SD-installable app image) ──────
;   Plain app image for the v2 shared table's ota_0 (0x90000, 3.25MB). FS-less
;   so it never touches mcfs/spiffs/nesrom/tiles (would wipe MeshCore/Meshtastic).
;   Full experience: dual LED output + TFT status + buttons + Pride.
[env:badge-launcher-v2]
extends = env:badge-dual
board_build.partitions = ${PROJECT_DIR}/retia/partitions-shared-v2.csv
board_build.app_partition_name = ota_0
build_flags = ${env:badge-dual.build_flags}
  -D WLED_LAUNCHER_GUEST

; ── WLEDkitty for the USB Nugget (LOLIN S2 Mini, ESP32-S2, 4MB) ──────────────
;   The USB Nugget is a LOLIN S2 Mini at heart, so it extends that env (I2C on
;   SDA33/SCL35 is already the base default, matching the OLED wiring).
;   LEDs: 1 onboard WS2812 on GPIO12 (chainable). Display: 128x64 SH1106 I2C
;   OLED via the Four-Line-Display usermod. Buttons: 4-way d-pad only (no A/B) —
;   UP=9 DOWN=18 LEFT=11 RIGHT=7. WLED compacts its button vector over disabled
;   (-1) pins, so BTNPIN=-1,9,18,11,7 gives one placeholder (index 0) + the four
;   d-pad buttons at indices 1-4. WLED_NUGGET_S2_DPAD (button.cpp) maps those:
;   tap UP/DOWN = +/- brightness, tap LEFT/RIGHT = +/- hue, hold UP = on/off,
;   hold DOWN = next effect, hold LEFT/RIGHT = scroll hue. Pride boot.
[env:usb-nugget]
extends = env:lolin_s2_mini
custom_usermods = usermod_v2_four_line_display_ALT
build_flags = ${env:lolin_s2_mini.build_flags}
  -D DATA_PINS=12
  -D DEFAULT_LED_COUNT=1
  -D BTNPIN=-1,9,18,11,7             ;; placeholder + UP,DOWN,LEFT,RIGHT -> idx 1-4
  -D WLED_NUGGET_S2_DPAD             ;; 4-button d-pad handlers (button.cpp)
  -D I2CSDAPIN=33
  -D I2CSCLPIN=35
  -D FLD_TYPE=SH1106                 ;; 128x64 SH1106 OLED (RubberNugget SH1106Wire)
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63

; ── WLEDkitty for the Pusheen cat lamp (ESP8266 / nodemcuv2, 4MB) ────────────
;   LEDs: 4x WS2812 on D1 = GPIO5. One button on D3 = GPIO0 (WLED's default
;   button pin): tap = on/off, hold = brightness, double = next palette. No
;   display, no d-pad. Boots into the Pride rainbow.
[env:pusheen]
extends = env:nodemcuv2
custom_usermods =
build_flags = ${env:nodemcuv2.build_flags}
  -D DATA_PINS=5
  -D DEFAULT_LED_COUNT=4
  -D BTNPIN=0
  -D DEFAULT_MODE=63
  -D DEFAULT_BOOT_FX=63
